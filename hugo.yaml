baseURL: "https://stack3mpty.cn/"
languageCode: "zh-cn"
title: "stack3mpty"
theme: "stack-minimal"
timeZone: "Asia/Shanghai"
enableRobotsTXT: true
hasCJKLanguage: true

permalinks:
  posts: "/:year/:month/:slug/"

pagination:
  pagerSize: 10

taxonomies:
  tag: "tags"
  category: "categories"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    guessSyntax: true
    noClasses: true
    style: "github"

params:
  author: "stack3mpty"
  description: "记录工程实践、系统设计、AI 时代的软件开发和长期思考。"
  dateFormat: "2006-01-02"
  showReadingTime: true

menus:
  main:
    - name: "文章"
      pageRef: "/posts"
      weight: 10
    - name: "关于"
      pageRef: "/about"
      weight: 20

caches:
  images:
    dir: ":cacheDir/images"
