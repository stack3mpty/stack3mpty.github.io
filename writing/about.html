    <time datetime="2026-08-31">2026-08-31</time>
    <p>这里没有博客框架，也没有构建步骤。每篇文章都是 GitHub Pages 直接托管的独立 HTML 文件。</p>
    <p>以后新增文章，只需要复制一份现有文章文件，修改标题、日期和正文，再在目录页以及主页的 <code>WRITING</code> 中各加一个链接。</p>
