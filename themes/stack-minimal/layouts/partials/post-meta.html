<div class="post-meta">
  {{ if not .Date.IsZero }}
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format (site.Params.dateFormat | default "2006-01-02") }}</time>
  {{ end }}
  {{ if site.Params.showReadingTime }}
    <span>{{ .ReadingTime }} 分钟读完</span>
  {{ end }}
  {{ with .Params.tags }}
    <span class="meta-tags">
      {{ range . }}
        <a href="{{ printf "tags/%s/" (. | urlize) | relURL }}">#{{ . }}</a>
      {{ end }}
    </span>
  {{ end }}
</div>
